version: 2

builds:
  - main: ./cmd/prs
    binary: prs
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "prs_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
