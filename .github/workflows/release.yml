name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two pushes to main inside one run's window would otherwise race to cut the
# same version. Never cancel-in-progress: a canceled release can leave a tag
# with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag is permanent once the module proxy has cached it, so the tagged
  # commit must be green first.
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: [validate]
    uses: datapointchris/reusable-workflows/.github/workflows/go-semantic-release.yml@v1
    permissions:
      contents: write
    with:
      # Keeps this on 0.x. Without it go-semantic-release forces a major bump on
      # any change while the major is 0.
      allow-initial-development-versions: true
      goreleaser: true
      # A tag exists before the module proxy has fetched it, and `go install
      # <module>@latest` resolves through that proxy. Inside the gap it returns
      # the previous version.
      prime-module-proxy: true
